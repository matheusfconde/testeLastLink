version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: lastlink_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lastlink_products
    ports:
      - "5433:5432" # 5433 pois tenho local um rodando na porta 5432
    volumes:
      # mantém dados persistentes
      - pgdata:/var/lib/postgresql/data
      # (opcional) inicializa tabelas automaticamente
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: lastlink_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    container_name: lastlink_api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=lastlink_products;Username=postgres;Password=postgres
      - RabbitMq__Host=rabbitmq
    ports:
      - "5000:80"
    restart: always

  consumer:
    build:
      context: .
      dockerfile: src/Consumer/Dockerfile
    container_name: lastlink_consumer
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=lastlink_products;Username=postgres;Password=postgres
      - RabbitMq__Host=rabbitmq
    restart: always

volumes:
  pgdata:
